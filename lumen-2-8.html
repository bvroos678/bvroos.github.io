/* Lumen 2.0 animated home hero, merged into the existing media center */
.lh-hero{position:relative;isolation:isolate;display:grid;grid-template-columns:minmax(0,1.02fr) minmax(280px,.98fr);align-items:center;gap:clamp(10px,3vw,42px);min-height:390px;padding:clamp(22px,4vw,52px) 0 22px;overflow:hidden;border-radius:24px}

.lh-actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:21px}

.lh-grid{position:absolute;inset:-22%;z-index:-3;opacity:.2;pointer-events:none;background-image:linear-gradient(#8290b51c 1px,transparent 1px),linear-gradient(90deg,#8290b51c 1px,transparent 1px);background-size:42px 42px;transform:perspective(650px) rotateX(61deg) scale(1.5);mask-image:linear-gradient(transparent,#000 25%,#000 75%,transparent);animation:lh-grid-drift 18s linear infinite}

.lh-halo:after{inset:-10%;border-color:#65eaff2b;transform:rotateX(72deg) rotateZ(-35deg)}
.lh-orb{position:relative;z-index:1;width:clamp(135px,18vw,205px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 32% 25%,#f4ffff 0 1%,#9cf6ff 4%,#5de8ff 10%,#4b76db 28%,#2d285e 52%,#111326 70%,#070911 76%);box-shadow:inset -22px -25px 48px #02030c,inset 10px 10px 24px #e2ffffa6,0 0 40px #58dfff5a,0 0 110px #6d68ff35;animation:lh-orb-float 5.8s ease-in-out infinite;cursor:pointer;transition:filter .2s}

.lh-card small{font-size:8px;color:#d9e4ff;letter-spacing:.08em}.lh-cardline{height:4px;border-radius:9px;background:#e8efff50;margin-top:5px;width:72%}.lh-cardline.short{width:42%;background:#a7b3d84d}

/* Lumen 2.1 motion layer */
:root{--ease:cubic-bezier(.22,1,.36,1);--spring:cubic-bezier(.34,1.56,.64,1)}
html{scroll-behavior:smooth}*{scrollbar-width:thin;scrollbar-color:#ffffff2a transparent}::selection{background:color-mix(in srgb,var(--accent) 40%,transparent)}
.btn,.nav button,.episode,.playerbar button{position:relative;overflow:hidden;transition:transform .25s var(--spring),background-color .2s,border-color .2s,color .2s,box-shadow .25s,filter .2s}
.btn:hover,.episode:hover{border-color:#ffffff33;background-color:var(--panel2)}.btn.primary:hover{filter:brightness(1.1);box-shadow:0 8px 26px color-mix(in srgb,var(--accent) 35%,transparent)}.episode:hover{transform:translateX(3px)}
.btn:active,.nav button:active,.episode:active,.playerbar button:active{transform:scale(.95);transition-duration:.08s}
.rip{position:absolute;border-radius:50%;pointer-events:none;background:#ffffff40;transform:scale(0);animation:rip .6s var(--ease) forwards}@keyframes rip{to{transform:scale(1);opacity:0}}
.nav{position:relative;isolation:isolate}.navPill{position:absolute;z-index:-1;top:4px;bottom:4px;left:0;width:0;border-radius:999px;background:var(--grad);box-shadow:0 4px 18px color-mix(in srgb,var(--accent) 30%,transparent);transition:transform .45s var(--ease),width .45s var(--ease)}.nav button.active{background:transparent!important}
.top{transition:background .3s,box-shadow .3s}.top.scrolled{background:#0a0c11eb;box-shadow:0 8px 30px #0006}
.search{transition:width .45s var(--ease),border-color .25s,box-shadow .25s,background .25s}.search:focus{width:min(430px,46vw);border-color:var(--accent);background:var(--panel2);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 22%,transparent)}
.field,.area{transition:border-color .2s,box-shadow .25s}.field:focus,.area:focus{border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 20%,transparent)}

tingCast">Casting</label><button class="btn" data-cast-now>Choose playback device</button><p class="hint">Uses browser Remote Playback where supported. Device discovery depends on the browser and network.</p></div></div><div class="panel"><h2 class="sectionTitle">Account connections</h2><p>Stremio and Nuvio do not provide a universal browser-safe account-link endpoint for third-party single-file apps. Lumen will not ask for your account password or pretend to sync your account.</p><p class="hint">To bring your add-ons across, open the Add-ons tab and install each app's Stremio-compatible manifest URL. That is the supported shared format.</p><div class="lineform"><button class="btn primary" data-go="addons">Manage add-ons</button><button class="btn" data-export-addons>Export add-on list</button><button class="btn" data-import-addons>Import add-on list</button></div></div><div class="panel"><h2 class="sectionTitle">Security hardening</h2><ul><li>Remote JavaScript plugins are disabled; integrations use manifest URLs only.</li><li>New add-on manifests must use HTTPS (HTTP is allowed only for localhost testing).</li><li>Jellyfin login requires HTTPS except for localhost testing; do not expose playback URLs containing API keys.</li><li>Pasted CSS cannot import or load external resources; direct external stylesheets must use HTTPS.</li><li>Public manifest requests omit browser credentials.</li><li>Keep Jellyfin updated, use HTTPS, disable public admin access, and use a separate non-admin Jellyfin account for playback.</li></ul><p class="hint">A standalone HTML file cannot stop a compromised host or enforce response headers. On your web server, configure a strict Content-Security-Policy, HSTS, X-Content-Type-Options: nosniff, Referrer-Policy: no-referrer, and a restrictive Permissions-Policy. Keep server software and plugins patched, require strong unique passwords, and do not expose the Jellyfin admin panel to the public internet. Configure the Content-Security-Policy and async function loadHomeCatalogs(){const cats=capableCatalogs().slice(0,8);await Promise.all(cats.map(async(x,i)=>{const el=$('#cat-'+i);if(!el)return;const res=await loadCatalog(x.a,x.c);if(!document.querySelector(`[data-catalog-row="${i}"]`))return;if(!res.items.length){document.querySelector(`[data-catalog-row="${i}"]`)?.remove();return}el.innerHTML=res.items.slice(0,24).map(m=>metaCard({...m,type:x.c.type},x.a)).join('')}))}
async function searchAll(term){state.view='home';state.searchResults=null;render();const locals=state.lib.filter(x=>(x.name+' '+cleanTitle(x.name)+' '+(x.m?.name||'')).toLowerCase().includes(term.toLowerCase()));const cats=capableCatalogs().filter(x=>hasSearch(x.c));const results=await Promise.all(cats.map(async x=>{const res=await loadCatalog(x.a,x.c,term);return {...res,a:x.a,c:x.c}}));const items=[];for(const r of results)for(const m of r.items)items.push({m:{...m,type:r.c.type},a:r.a});state.searchResults={term,locals,items,jfr:window.jfSearch?await jfSearch(term):[]};renderSearchResults()}
function renderSearchResults(){if(!state.searchResults)return;const app=$('#app'),r=state.searchResults;app.innerHTML=`<section class="section"><h1>Search results</h1><p class="muted">${esc(r.term)}</p><h2 class="sectionTitle">Local files</h2>${r.locals.length?`<div class="grid">${r.locals.map(localCard).join('')}</div>`:'<div class="empty">No local matches.</div>'}<h2 class="sectionTitle" style="margin-top:30px">Add-on results</h2>${r.items.length?`<div class="grid">${r.items.map(x=>metaCard(x.m,x.a)).join('')}</div>`:'<div class="empty">No add-on results. Install a search-capable catalog add-on.</div>'}${r.jfr?.length?'<h2 class="sectionTitle" style="margin-top:30px">Jellyfin</h2><div class="grid">'+r.jfr.map(window.jfCard).join('')+'</div>':''}</section>`}

function parseM3U(text){const out=[];let current={};for(const raw of String(text||'').split(/\r?\n/)){const line=raw.trim();if(!line)continue;if(/^#EXTINF/i.test(line)){const comma=line.indexOf(',');const attrs=line.slice(0,comma<0?line.length:comma);const title=comma>=0?line.slice(comma+1).trim():'';const g=attrs.match(/group-title="([^"]*)"/i);const logo=attrs.match(/tvg-logo="([^"]*)"/i);current={name:title||attrs.match(/tvg-name="([^"]*)"/i)?.[1]||'Channel',group:g?.[1]||'Other',logo:logo?.[1]||''}}else if(!line.startsWith('#')){if(safe(line,/^https?:\/\//i))out.push({...current,url:line,id:'iptv-'+out.length});current={}}}return out}
function renderIPTVChannels(filter=''){const list=state.iptv.filter(x=>(x.name+' '+x.group).toLowerCase().includes(filter.toLowerCase()));return list.length?list.slice(0,500).map(x=>`<div class="iptv-card">${imageUrl(x.logo)?`<img src="${esc(x.logo)}" alt="" style="width:48px;height:48px;object-fit:contain;border-radius:8px">`:''}<div class="grow"><strong>${esc(x.name||'Channel')}</strong><small>${esc(x.group||'Playlist')}</small></div><span class="pill-live">LIVE</span><button class="btn primary small" data-iptv-play="${esc(x.id)}">Play</button></div>`).join(''):'<div class="empty">No channels loaded. Import an M3U playlist or connect Xtream.</div>'}
async function loadM3UUrl(url){if(!safe(url,/^https?:\/\//i)){message('Enter an HTTP or HTTPS playlist URL.',true);return}try{const r=await fetch(url,{signal:AbortSignal.timeout(15000)});if(!r.ok)throw Error('HTTP '+r.status);const text=await r.text();const rows=parseM3U(text);if(!rows.length)throw Error('No valid HTTP channel URLs were found');state.iptv=rows;render();message('Loaded '+rows.length+' channels.')}catch(e){message('Playlist could not load. It may be offline, invalid, or blocked by CORS.',true)}}
async function loadXtream(){const host=$('#xtHost').value.trim().replace(/\/+$/,''),user=$('#xtUser').value.trim(),pass=$('#xtPass').value;if(!safe(host,/^https?:\/\//i)||!user||!pass){message('Enter a valid server URL, username and password.',true);return}const u=host+'/get.php?username='+encodeURIComponent(user)+'&password='+encodeURIComponent(pass)+'&type=m3u_plus&output=ts';await loadM3UUrl(u);$('#xtPass').value='';}
function saveSettings(){writeStore('lumen.settings',state.settings);const root=document.documentElement;const palettes={blue:['#79a6ff','#b38cff'],green:['#73e0ba','#83aaff'],rose:['#ff8fb4','#b38cff'],amber:['#ffc879','#ff8fb4']};const c=palettes[state.settings.accent];if(c){root.style.setProperty('--accent',c[0]);root.style.setProperty('--accent2',c[1]);root.style.setProperty('--grad',`linear-gradient(120deg,${c[0]},${c[1]})`)}else['--accent','--accent2','--grad'].forEach(p=>root.style.removeProperty(p));document.documentElement.style.setProperty('--player-fit',state.settings.fit||'contain');document.documentElement.style.setProperty('scroll-behavior',state.settings.motion==='on'?'auto':'smooth');document.documentElement.classList.toggle('lumen-reduced-motion',state.settings.motion==='on');}
function applySettingsToUI(){saveSettings();for(const [id,key] of [['settingAccent','accent'],['settingMotion','motion'],['settingAutoplay','autoplay'],['settingFit','fit'],['settingResume','resume'],['settingSkipIntro','skipIntro'],['settingAutoNext','autoNext']]){const el=$('#'+id);if(el)el.value=state.settings[key]||({accent:'auto',motion:'auto',autoplay:'on',fit:'contain',resume:'on',skipIntro:'on',autoNext:'on'}[key])}}
function castCurrent(){const v=$('#playerVideo');if(!v){message('Start playing a video before choosing a device.',true);return}try{if(v.remote&&v.remote.prompt){v.remote.prompt().catch(()=>message('No compatible playback device was selected.',true));return}if(typeof v.webkitShowPlaybackTargetPicker==='function'){v.webkitShowPlaybackTargetPicker();return}message('This browser does not expose casting controls. Try Chrome with a compatible Cast device, or AirPlay on a supported Apple device.',true)}catch(_){message('Casting is unavailable in this browser.',true)}}

function importAddonList(file){const r=new FileReader();r.onload=async()=>{try{const data=JSON.parse(String(r.result||''));if(!Array.isArray(data))throw Error();for(const a of data){if(a&&a.url)await installAddon(a.url)}message('Add-on list import finished.')}catch(_){message('Invalid Lumen add-on list file.',true)}};r.readAsText(file)}

async function saveJfRepositories(repos){if(!S.jf?.admin)throw Error('Connect with a Jellyfin administrator account to change repositories.');const r=await net(S.jf.url+'/Repositories',{method:'POST',headers:{'Content-Type':'application/json',...hdr(S.jf.token)},body:JSON.stringify(repos)});if(!r.ok)throw Error('Jellyfin could not save the repository list (HTTP '+r.status+').');S.jfRepositories=repos;message('Jellyfin repository list saved. Refresh the plugin catalog in Jellyfin to see packages.');render()}
async function addJfRepository(){const name=$('#jfRepoName')?.value.trim(),raw=$('#jfRepoUrl')?.value.trim();if(!name||!raw)throw Error('Enter a repository name and manifest URL.');let u;try{u=new URL(raw)}catch(_){throw Error('Enter a valid manifest URL.')}if(u.protocol!=='https:'||u.username||u.password||! /manifest\.json$/i.test(u.pathname))throw Error('Use an HTTPS Jellyfin repository URL ending in manifest.json, without embedded credentials.');const repos=Array.isArray(S.jfRepositories)?S.jfRepositories.slice():await jf('/Repositories');if(repos.some(x=>String(x.Url||x.url||'').toLowerCase()===u.href.toLowerCase()))throw Error('That repository URL is already installed.');repos.push({Name:name,Url:u.href,Enabled:true});await saveJfRepositories(repos)}

async function jfLogin(url,user,pw){url=url.trim().replace(/[?#].*$/,'').replace(/\/web(\/.*)?$/i,'').replace(/\/+$/,'');if(!url)throw Error('Enter your server address.');if(!user.trim())throw Error('Enter your username.');if(!/^https?:\/\//i.test(url))url='https://'+url;let parsed;try{parsed=new URL(url)}catch(_){throw Error('Enter a valid Jellyfin server address.')}const localHost=['localhost','127.0.0.1','[::1]'].includes(parsed.hostname.toLowerCase());if(parsed.username||parsed.password)throw Error('Do not put credentials in the server address.');if(parsed.protocol!=='https:'&&!(parsed.protocol==='http:'&&localHost))throw Error('Jellyfin login requires HTTPS. HTTP is allowed only for localhost testing.');url=parsed.href.replace(/\/+$/,'');const pr=await net(url+'/System/Info/Public');let info=null;try{info=await pr.json()}catch(_){}if(!pr.ok||!info||!(info.ServerName||info.Version))throw Error('That address did not respond like a Jellyfin server.');const r=await net(url+'/Users/AuthenticateByName',{method:'POST',headers:{'Content-Type':'application/json',...hdr()},body:JSON.stringify({Username:user,Pw:pw})});if(r.status===401)throw Error('Wrong username or password.');if(!r.ok)throw Error('Server returned '+r.status);const d=await r.json();try{sessionStorage.setItem('lumen.jf.token',d.AccessToken)}catch(_){throw Error('Secure session storage is unavailable in this browser.')}S.jf={url,token:d.AccessToken,uid:d.User.Id,name:d.User.Name,admin:!!d.User.Policy?.IsAdministrator};const {token,...safeJf}=S.jf;writeStore('lumen.jf',safeJf)}
async function jfLoad(){if(S.jfLoading)return;S.jfLoading=true;try{const u='/Users/'+S.jf.uid,F='&Fields=ProductionYear&ImageTypeLimit=1';const [res,views]=await Promise.all([jf(u+'/Items/Resume?Limit=12&MediaTypes=Video'+F),jf(u+'/Views')]);const rows=[];if(res.Items?.length)rows.push({title:'Continue on Jellyfin',items:res.Items});await Promise.all((views.Items||[]).map(async v=>{try{const l=await jf(u+'/Items/Latest?Limit=16&ParentId='+v.Id+F);if(l.length)rows.push({title:'Latest in '+v.Name,items:l})}catch(_){}}));S.jfRows=rows}catch(e){S.jfRows=[];message(e.message,true)}S.jfLoading=false;render()}
async function jfOpen(id,title){try{const d=await jf('/Users/'+S.jf.uid+'/Items?ParentId='+id+'&SortBy=SortName&Fields=ProductionYear');S.jfStack.push({title,items:d.Items||[]});render()}catch(e){message(e.message,true)}}
async function jfPlay(id,title){const c=S.jf;if(!c)return;let direct=false;try{const it=await jf('/Users/'+c.uid+'/Items/'+id);const ct=String(it.MediaSources?.[0]?.Container||it.Container||'').toLowerCase().split(',')[0];direct=/^(mp4|m4v|mov|webm)$/.test(ct);const pt=it.UserData?.PlaybackPositionTicks;if(pt&&!S.prog['jf:'+id])S.prog['jf:'+id]={t:pt/1e7,d:(it.RunTimeTicks||0)/1e7,title,url:'',img:'',ts:Date.now()}}catch(e){message(e.message,true);return}const q=`MediaSourceId=${id}&api_key=${encodeURIComponent(c.token)}`;playMedia(direct?`${c.url}/Videos/${id}/stream?static=true&${q}`:`${c.url}/Videos/${id}/master.m3u8?${q}&VideoCodec=h264&AudioCodec=aac,mp3&SegmentContainer=ts&MinSegments=1&BreakOnNonKeyFrames=true&PlaySessionId=${Date.now()}`,title,'jf:'+id,true);if(state.cur)prepareJellyfinAutomation(it)}window.jfPlay=jfPlay;
const FOLD=/^(Series|Season|BoxSet|CollectionFolder|Folder|UserView|MusicAlbum|Playlist)$/;
const jfCard=it=>{const c=S.jf,p=it.UserData?.PlayedPercentage,t=it.SeriesName?it.SeriesName+' · '+it.Name:it.Name;return `<article class="cardBox${/^(Movie|Series|Season|BoxSet)$/.test(it.Type)?' tall':''}" data-jf="${esc(it.Id)}" data-jft="${esc(it.Type)}" data-jfn="${esc(t)}" tabindex="0"><div class="poster"><div class="letter">${esc((it.Name||'?')[0])}</div><img src="${esc(c.url)}/Items/${esc(it.Id)}/Images/Primary?maxWidth=480" alt="" loading="lazy"></div><div class="cardTitle">${esc(t)}</div><div class="sub">${esc(it.ProductionYear||it.Type||'')}</div>${p?`<div class="progress"><span style="width:${Math.min(100,p)}%"></span></div>`:''}</article>`};
window.jfCard=jfCard;window.jfSearch=async t=>{if(!S.jf)return[];try{const d=await jf('/Users/'+S.jf.uid+'/Items?Recursive=true&SearchTerm='+encodeURIComponent(t)+'&IncludeItemTypes=Movie,Series,Episode&Limit=24&Fields=ProductionYear');return d.Items||[]}catch(_){return[]}};V.jellyfin=()=>{if(!S.jf)return `<section class="section">${S.cspBlocked?`<div class="note error">${NOHOST}</div>`:''}<h1>Jellyfin</h1><p class="muted">Connect your own Jellyfin server to browse and play its libraries here.</p><div class="panel"><div class="jfform"><input id="jfUrl" class="field" type="url" placeholder="https://jellyfin.example.com" aria-label="Server address"><input id="jfUser" class="field" placeholder="Username" autocomplete="username" aria-label="Username"><input id="jfPw" class="field" type="password" placeholder="Password" autocomplete="current-password" aria-label="Password"><button class="btn primary" data-jf-login>Connect</button></div><p class="hint">The session token stays in this tab's session storage and is cleared when the browser session ends. Your server must allow requests from this page (CORS), and an https page can only reach https servers.</p></div></section>`;const b=S.jfStack[S.jfStack.length-1];return `<section class="section"><h1>Jellyfin</h1><p class="muted">${esc(S.jf.name)} on ${esc(S.jf.url)}</p><div class="lineform">${b?'<button class="btn" data-jf-back>Back</button>':''}<button class="btn" data-jf-refresh>Refresh</button><button class="btn danger" data-jf-logout>Disconnect</button></div></section>`+(b?sec(b.title,`<div class="grid">${b.items.map(jfCard).join('')||'<div class="empty">Nothing here.</div>'}</div>`):(S.jfRows||[]).map(r=>sec(r.title,rowOf(r.items.map(jfCard).join('')))).join('')||`<div class="empty">${S.jfRows?'No items found.':'Loading your libraries…'}</div>`)};
V.streaming=()=>{const cats=['All','Added',...new Set(SVC.map(x=>x[4]))],c=S.svcCat||'All',list=SVC.filter(x=>c==='All'||(c==='Added'?S.my.includes(x[0]):x[4]===c));return `<section class="section"><h1>Streaming services</h1><p class="muted">Add the services you subscribe to. They appear on Home, and Open takes you to the service.</p><div class="presets">${cats.map(x=>`<button class="preset" data-svccat="${esc(x)}" aria-pressed="${x===c}">${esc(x)}${x==='Added'?' ('+S.my.length+')':''}</button>`).join('')}</div></section><div class="svcGrid">${list.map(x=>{const on=S.my.includes(x[0]);return `<div class="svc ${on?'on':''}">${tile(x)}<div class="svcbar"><strong class="svn">${esc(x[0])}</strong><button class="btn small" data-svc="${esc(x[0])}" aria-pressed="${on}">${on?'Added':'Add'}</button><button class="btn small" data-open="${x[3]}">Open</button></div></div>`}).join('')||'<div class="empty">Nothing added yet. Pick services from All.</div>'}</div><div class="lineform" style="margin-top:16px"><button class="btn small" data-logos>${S.logos?'Use offline logos':'Load official logos'}</button><span class="hint">${S.logos?'Logos load from each service’s site icon, so Google’s icon service sees which services are listed.':'Showing offline wordmarks. No requests are made.'}</span></div>`};
V.plugins=()=>`<section class="section"><h1>Plugins · Manifest URLs</h1><p class="muted">Jellyfin server plugins are managed through Jellyfin repository manifest URLs. Lumen add-ons use their separate Stremio-compatible manifest format.</p>${S.jf?`<div class="panel"><h2 class="sectionTitle">Jellyfin plugin repositories</h2>${S.jf.admin?`<form id="jfRepoForm" class="setting-grid"><div class="setting"><label for="jfRepoName">Repository name</label><input id="jfRepoName" class="field" placeholder="My trusted repository" required></div><div class="setting"><label for="jfRepoUrl">Manifest URL</label><input id="jfRepoUrl" class="field" type="url" placeholder="https://example.com/manifest.json" required></div><div class="lineform"><button class="btn primary" type="submit">Add repository</button><button class="btn" type="button" data-jf-official-repo>Use official stable URL</button></div></form><p class="hint">Only add repositories you trust: their packages are executable code installed on your Jellyfin server. Repository changes are sent to your server's admin API.</p>`:'<p class="hint">Connect with a Jellyfin administrator account to manage repository manifest URLs. Your current account can still browse the installed-plugin list if the server allows it.</p>'}<div class="lineform" style="margin:12px 0"><strong class="grow">Repositories</strong><button class="btn small" data-jf-repos-refresh>Refresh</button></div>${(S.jfRepositories||[]).map((r,i)=>`<div class="itemrow"><div class="grow"><strong>${esc(r.Name||r.name||'Repository')}</strong><small>${esc(r.Url||r.url||'')}</small></div><span class="badge">${(r.Enabled??r.enabled)?'Enabled':'Disabled'}</span>${S.jf.admin?`<button class="btn danger small" data-jf-repo-remove="${i}">Remove</button>`:''}</div>`).join('')||'<div class="empty">No repositories loaded yet. Refresh to read the server list.</div>'}</div><div class="panel"><h2 class="sectionTitle">Installed Jellyfin plugins</h2>${(S.jfPlugins||[]).map(p=>`<div class="itemrow"><div class="grow"><strong>${esc(p.Name||'Plugin')}</strong><small>v${esc(p.Version||'')} · ${esc(p.Status||'')}</small></div></div>`).join('')||'<div class="empty">No installed plugins listed, or the server has not returned them yet.</div>'}</div>`:`<div class="panel"><h2 class="sectionTitle">Connect Jellyfin</h2><p>Connect to your Jellyfin server first. Repository management requires a Jellyfin administrator account.</p><button class="btn primary" data-go="jellyfin">Open Jellyfin</button></div>`}</section><section class="panel"><h2 class="sectionTitle">Lumen add-ons · Stremio/Nuvio manifests (${S.addons.length})</h2><form id="pluginManifestForm" class="lineform"><input id="pluginManifestUrl" class="field" type="url" placeholder="https://example.com/manifest.json" aria-label="Add-on manifest URL" required><button class="btn primary" type="submit">Install add-on</button></form><p class="hint">These manifests power Lumen catalogs and streams. They are not Jellyfin server plugin repositories, and Lumen never executes remote plugin scripts.</p>${S.addons.map(a=>`<div class="itemrow"><div class="grow"><strong>${esc(a.m.name||a.m.id)}</strong><small>${esc(a.url)}</small><small>Resources: ${esc((a.m.resources||[]).map(r=>typeof r==='string'?r:r.name).join(', ')||'none')}</small></div><button class="btn danger small" data-remove-addon="${esc(a.m.id)}">Remove</button></div>`).join('')||'<div class="empty">No Lumen add-ons installed.</div>'}</section>`;;
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.classList?.contains('cardBox')){e.preventDefault();e.target.click()}});
// Remote JavaScript plugins are intentionally disabled; integrations are manifest-only.
const SK=[['lumen','Dusk','#ffb454'],['ember','Ember','#ff7a59'],['tide','Tide','#6fe0d0'],['cinema','Cinema','#ff5a4d'],['jellyfin','Jellyfin','#00a4dc'],['classic','Classic','#79a6ff']];
window.lumenAfter=()=>{const v=S.view,app=$('#app');
if(v==='home'){let h='';if(S.my.length)h+=sec('Your services',`<div class="svcStrip">${SVC.filter(s=>S.my.includes(s[0])).map(s=>`<button data-open="${s[3]}" aria-label="Open ${esc(s[0])}">${tile(s)}</button>`).join('')}</div>`);Object.values(S.plugRows).forEach(r=>h+=sec(r.t,rowOf(r.i.map(plugCard).join(''))));(S.jfRows||[]).slice(0,3).forEach(r=>h+=sec(r.title,rowOf(r.items.map(jfCard).join(''))));app.querySelector('.lh-hero')?.insertAdjacentHTML('afterend',h);if(S.jf&&!S.jfRows)jfLoad()}
if(v==='jellyfin'&&S.jf&&!S.jfRows)jfLoad();
if(v==='plugins'&&S.jf&&!S.jfRepositories)loadJfRepositories();if(v==='plugins'&&S.jf?.admin&&!S.jfPlugins){S.jfPlugins=[];jf('/Plugins').then(d=>{S.jfPlugins=d;render()}).catch(e=>message(e.message,true))}
if(v==='themes')app.querySelector('.section')?.insertAdjacentHTML('afterend',`<section class="panel"><h2 class="sectionTitle">Built-in themes</h2><div class="presets">${SK.map(k=>`<button class="preset" data-skin="${k[0]}" aria-pressed="${(S.settings.skin||'lumen')===k[0]}"><i style="background:${k[2]}"></i>${k[1]}</button>`).join('')}</div>${S.jf?'<div class="lineform" style="margin-top:14px"><button class="btn" data-jf-theme>Import theme from your Jellyfin server</button></div>':''}</section>`)};
document.addEventListener('submit',async e=>{if(e.target.id!=='jfRepoForm')return;e.preventDefault();try{await addJfRepository();$('#jfRepoForm')?.reset()}catch(x){message(x.message,true)}});
document.addEventListener('click',async e=>{const b=e.target.closest('button,[data-jf],[data-plugopen]');if(!b)return;const d=b.dataset;
if(d.svccat){S.svcCat=d.svccat;render();return}
if(b.hasAttribute('data-jf-official-repo')){$('#jfRepoName').value='Jellyfin Stable';$('#jfRepoUrl').value='https://repo.jellyfin.org/files/plugin/manifest.json';return}
if(b.hasAttribute('data-jf-repos-refresh')){S.jfRepositories=null;loadJfRepositories();return}
if(b.hasAttribute('data-jf-repo-remove')){try{const repos=(S.jfRepositories||[]).filter((_,i)=>i!==Number(d.jfRepoRemove));await saveJfRepositories(repos)}catch(x){message(x.message,true)}return}
if(b.hasAttribute('data-logos')){S.logos=!S.logos;writeStore('lumen.logos',S.logos);render();return}
if(b.hasAttribute('data-jf-theme')){try{const r=await net(S.jf.url+'/Branding/Css');const t=r.ok?(await r.text()).trim():'';if(!t)throw Error('This server has no custom CSS set.');addTheme(t,'Jellyfin server theme')}catch(x){message(x.message,true)}return}
if(d.skin){S.settings.skin=d.skin;document.documentElement.dataset.skin=d.skin;saveSettings();render();return}
if(d.svc){S.my=S.my.includes(d.svc)?S.my.filter(x=>x!==d.svc):[...S.my,d.svc];writeStore('lumen.services',S.my);render();return}
if(d.plugopen){window.open(d.plugopen,'_blank','noopener,noreferrer');return}
if(b.hasAttribute('data-jf-login')){try{await jfLogin($('#jfUrl').value,$('#jfUser').value,$('#jfPw').value);S.jfRows=null;S.jfStack=[];message('Connected to Jellyfin.')}catch(x){message(x.message,true)}return}
if(b.hasAttribute('data-jf-logout')){S.jf=null;S.jfRows=null;S.jfStack=[];S.jfPlugins=null;writeStore('lumen.jf',null);try{sessionStorage.removeItem('lumen.jf.token')}catch(_){}render();return}
if(b.hasAttribute('data-jf-refresh')){S.jfRows=null;S.jfStack=[];S.jfPlugins=null;render();return}
if(b.hasAttribute('data-jf-back')){S.jfStack.pop();render();return}
if(d.jf){if(FOLD.test(d.jft))jfOpen(d.jf,d.jfn);else jfPlay(d.jf,d.jfn);return}
});
})();
</script></body></html>
